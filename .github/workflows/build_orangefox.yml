name: OrangeFox - 小米14 Ultra (aurora) 云端编译

# 用法: 把本文件放到仓库 .github/workflows/ 下, 同目录放 OrangeFoxConfig.mk
# 然后 Actions -> 本工作流 -> Run workflow, 结束后在 Artifacts 下载 boot.img

on:
  push:                # 推送即自动开始编译(网络受限环境无需手动触发)
  workflow_dispatch:   # 手动触发

jobs:
  build:
    runs-on: ubuntu-22.04   # 固定 22.04: AOSP/橙狐编译的标准环境, 软件包名稳定
    timeout-minutes: 360   # 上限 6 小时
    permissions:
      contents: write   # 失败时把诊断日志推送到 ci-logs 分支, 供匿名拉取(artifact 下载 API 需要登录, 分支 raw 文件不需要)

    # run#10~#13 教训: step8 总在开始后 3~10 分钟内被外部 SIGTERM 终止(日志实锤: soong bootstrap 99% 处
    # "Got signal: terminated", trap 正常执行、日志成功推送 → 是 runner 被基础设施回收, 不是编译错误、
    # 不是 OOM(OOM 是 SIGKILL)、不是页面取消(那会标记 cancelled)。无法预防, 只能用独立随机事件对冲:
    # 3 路独立 VM 并行跑同一构建, 随机回收不可能 3 路全中; public 仓库 Actions 免费无时长限制。
    strategy:
      fail-fast: false   # 关键: 任何一路失败/被杀绝不牵连其余两路
      matrix:
        shard: [a, b, c]

    steps:
      - name: 检出仓库 (取 OrangeFoxConfig.mk)
        uses: actions/checkout@v4

      - name: 最大化磁盘空间
        run: |
          # run#17 定案(2026-09-23): s3 旧清单清完后仍不够——146G 盘被完整 14.1 树+32G swapfile
          # 吃满, s8 起步仅 2.6G。扩大清理: hostedtoolcache 整目录(Python/PyPy/Node 工具链, 不含
          # runner 自带 node, 不影响 actions)、miniconda、rust。JDK(/usr/lib/jvm)编译必需, 保留。
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/.ghcup \
                      /usr/share/swift /opt/az /opt/pipx \
                      /usr/share/miniconda /usr/share/rust* \
                      /var/lib/apt/lists/*
          sudo docker image prune -af || true
          sudo apt-get clean
          df -h /

      - name: 加 swap (防内存不足)
        run: |
          # run#13 教训: runner 镜像自带约 3G /swapfile 且已激活, 原写法 fallocate/mkswap/swapon 对活跃 swapfile
          # 全部静默失败(|| true 吞错), 实际 swap 仍只有 3G, soong bootstrap(链接 soong_build)在 99% 处
          # 内存耗尽被系统杀死("signal: killed")。改为: 先关掉自带 swap, 重建 32G, 全程 fail-fast, 末尾断言容量。
          # run#14/#15 新证据(2026-09-23): 换上 32G swap 后 4 路 job 仍全部死于两个固定内存尖峰窗
          # (soong bootstrap 99% 链接段 ≈ s8+6min; 全树编译提速段 ≈ s8+52min), 且 trap/if:failure 全未触发
          # → agent/VM 整体死亡, 不是步骤级失败。死亡点与构建阶段强相关(5/5 命中两个尖峰窗)、GitHub
          # status 全绿 → 推翻"基础设施随机回收"假设, 根因: 内存峰值期的 OOM 牺牲品轮盘(swap thrash
          # 拖死 agent 心跳 / oomd 整 cgroup 连坐)。处置三件套:
          #   1) 停 systemd-oomd: 防其按 cgroup 连坐杀掉 runner agent;
          #   2) Runner.Listener/Worker 设 oom_score_adj=-800: 内核 OOM 永不选 agent, 只杀构建进程
          #      → 步骤干净失败 → trap 取证可见真实报错;
          #   3) swappiness=10 + 提高 min_free_kbytes: 抑制 thrash 僵尸化, 让 OOM 尽快定点爆发。
          # run#16 定案(2026-09-23, check-run annotations 实锤, 3 路两种死法):
          #   b/c = agent 自身写日志 "No space left on device" → 磁盘 ENOSPC, 不是内存/编译错误/基础设施;
          #   a   = "lost communication ... starves it for CPU/Memory" → 内存/IO 饿死。
          # 磁盘对策: s8 起步清缓存 + 可用空间断言(<25G 主动失败留取证, 不裸奔到 agent 自爆);
          # 证据对策: s8 内后台看门狗每 3 分钟推 df/free/构建进度到 ci-live 分支, VM 硬死也留最后 3 分钟曲线。
          sudo systemctl stop systemd-oomd.socket systemd-oomd 2>/dev/null || true
          sudo systemctl disable systemd-oomd.socket systemd-oomd 2>/dev/null || true
          sudo sysctl -w vm.swappiness=10 vm.min_free_kbytes=131072
          pgrep -f 'Runner\.(Listener|Worker)' | while read -r p; do
            echo -800 | sudo tee /proc/$p/oom_score_adj >/dev/null || true
          done
          pgrep -af 'Runner\.(Listener|Worker)' || echo "!! 未找到 runner 进程, OOM 保护未生效"
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 32G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          swapon --show
          free -h
          avail=$(free -m | awk '/^Swap:/{print $2}')
          if [ "${avail:-0}" -lt 30000 ]; then
            echo "!! swap 未生效(仅 ${avail}Mi >= 30000 才放行), 中止以免重蹈 #13"
            exit 1
          fi

      - name: 安装编译依赖
        run: |
          for i in 1 2 3; do sudo apt-get update && break || (echo "update 重试 $i"; sleep 10); done
          PKGS="git gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib \
            g++-multilib libc6-dev-i386 libncurses-dev lib32ncurses-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig python3 python-is-python3 \
            lz4 liblz4-tool zstd openssl ccache rsync"
          for i in 1 2 3; do sudo apt-get install -y $PKGS && break || (echo "install 重试 $i"; sleep 10); done
          # repo 工具: 包源没有就直接装官方单文件版
          if ! command -v repo >/dev/null; then
            sudo curl -sSL https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
            sudo chmod a+x /usr/local/bin/repo
          fi
          command -v repo >/dev/null && repo version || echo "repo 将由 orangefox_sync 脚本处理"
          git config --global user.name "foxbuilder"
          git config --global user.email "foxbuilder@users.noreply.github.com"

      - name: 同步 OrangeFox fox_14.1 源码
        run: |
          mkdir -p ~/OrangeFox_sync
          git clone https://gitlab.com/OrangeFox/sync.git ~/OrangeFox_sync/sync
          cd ~/OrangeFox_sync/sync
          ./orangefox_sync.sh --branch 14.1 --path ~/fox_14.1
          test -f ~/fox_14.1/build/envsetup.sh   # fail-fast
          # run#17 定案(2026-09-23): 146G 盘装不下完整 14.1 树(.repo+工作区)+32G swapfile,
          # s8 起步仅剩 2.6G, 被 <25G 断言按设计拦下(trap 取证: df 99% used, 内存侧健康)。
          # 对策: 同步完成后立即裁掉 .repo 的 git 对象库(工作区文件原样保留), mka bootimage
          # 只读工作区, 这是 AOSP CI 的标准回收手段, 预期回收 40~70G。代价: repo 命令与
          # 各项目 git 历史查询失效; 内核 setlocalversion 在 git 不可用时优雅回退, 仅影响
          # 本地版本后缀, 不影响 boot.img 产物本身。若构建因缺 git 元数据失败, trap 日志可见。
          du -sh ~/fox_14.1/.repo/projects ~/fox_14.1/.repo/project-objects 2>/dev/null || true
          rm -rf ~/fox_14.1/.repo/projects ~/fox_14.1/.repo/project-objects
          df -h /
          test -f ~/fox_14.1/build/envsetup.sh   # 裁剪后复验 fail-fast

      - name: 接入 aurora 设备树并打橙狐补丁
        run: |
          # run#25/#26 定案(2026-09-23, 6/6 失败): step7 在线 clone 的 RWA82 树仅 3MB, 却在
          # Actions 上反复卡 5~20 分钟后死亡(#22~#24 同 clone 仅 1 秒); 本地逐字复现 step7 全部
          # 命令(bash -e -o pipefail + 真实 RWA82 树 + 真实 prebuilts/decrypt)秒级 EXIT=0
          # → 脚本无错, 根因是 runner 出口 IP 对 github 匿名 clone 的限速/卡死。
          # 根治: RWA82 上游自 2025-04-28(c715e9f)起冻结, 整树 vendor 进本仓库
          # prebuilts/rwa82-tree(git archive 提取), 编译期本地拷贝, step7 不再有任何在线操作。
          exec > >(tee /tmp/step7.log) 2>&1   # step7 全量留痕: 失败时随 diag 推 ci-logs, 匿名可查
          cd ~/fox_14.1
          # 修复: 树内 mk 硬编码 DEVICE_PATH := device/xiaomi/sm8650, 必须放到该路径
          # (上轮放到 device/xiaomi/aurora 导致 "device/xiaomi/sm8650/device.mk does not exist")
          mkdir -p device/xiaomi
          cp -a "$GITHUB_WORKSPACE/prebuilts/rwa82-tree" device/xiaomi/sm8650
          # DT 必须绝对路径: 下方解密栈拷贝的子 shell 会 cd 进 $DS/$SUB, 相对 $DT 在错误目录
          # 解析 → 94 个解密文件全拷进 $DS 垃圾嵌套目录(find/cp 还互相喂文件造成递归爆炸,
          # 5~20 分钟不等), 真正的 recovery/root 一件没落 → MUST 断言首项即杀 exit 1。
          # #25/#26 六路失败的确定性根因; 此前本地复现因误用绝对路径侥幸通过, 掩盖了本 bug。
          DT="$HOME/fox_14.1/device/xiaomi/sm8650"
          # fail-fast: vendor 树完整性断言(替代在线 clone 后的落位检查)
          test -f $DT/twrp_aurora.mk || { echo "!! vendor 树缺 twrp_aurora.mk"; exit 1; }
          test -f $DT/BoardConfig.mk || { echo "!! vendor 树缺 BoardConfig.mk"; exit 1; }
          test -f $DT/device.mk || { echo "!! vendor 树缺 device.mk"; exit 1; }
          test -d $DT/prebuilts/aurora || { echo "!! vendor 树缺 prebuilts/aurora(触屏固件+模块)"; exit 1; }
          test -d $DT/recovery/root || { echo "!! vendor 树缺 recovery/root"; exit 1; }
          # 修复: BoardConfig.mk 里的 BOARD_BUILD_SYSTEM_ROOT_IMAGE 在 fox_14.1(AOSP14) 构建系统已废弃,
          # 解析直接报错 "BOARD_BUILD_SYSTEM_ROOT_IMAGE is obsolete", lunch 全部失败。删除该行。
          sed -i '/BOARD_BUILD_SYSTEM_ROOT_IMAGE/d' $DT/BoardConfig.mk
          ! grep -q BOARD_BUILD_SYSTEM_ROOT_IMAGE $DT/BoardConfig.mk   # fail-fast: 确认已删净
          # run#21 曾把递归拷贝收窄为仅 firmware 子目录以绕过 check-non-elf 硬错 —— 但 run#22 实机定案:
          # 触屏驱动 synaptics_tcm2/goodix_cap/goodix_core/xiaomi_touch (.ko) 正是靠这条递归拷贝进入
          # recovery ramdisk, 由 init.recovery.qcom.rc early-init insmod /vendor/lib/modules/*.ko 加载;
          # 缺了它们触屏彻底无效(实机 21:46 确认)。对策: 恢复整目录递归拷贝, 并在 OrangeFoxConfig.mk
          # 打开官方豁免变量 BUILD_BROKEN_ELF_PREBUILT_PRODUCT_COPY_FILES := true 放行拷贝中的 ELF 模块。
          # run#32: prebuilts/aurora 整目录拷贝线彻底移除 —— 触屏固件(错误变体, 会重刷坏 IC 致
          # 触摸上报瘫痪, #31 实测)与错版 .ko(CRC 不符)两大毒性源头均在此目录; 正确件改由
          # prebuilts/houji_port 提供(odm 固件 = 手机 /odm/firmware 原版 + aurora THP 配置;
          # 模块 = 手机 vendor_dlkm 原版, 实测加载成功)。
          sed -i '\|device/xiaomi/sm8650/prebuilts/aurora|d' $DT/twrp_aurora.mk
          ! grep -q 'prebuilts/aurora' $DT/twrp_aurora.mk || { echo "!! twrp_aurora.mk 仍引用 prebuilts/aurora"; exit 1; }
          cp -v "$GITHUB_WORKSPACE/OrangeFoxConfig.mk" $DT/
          # fail-fast: 豁免变量必须已在配置中(触屏驱动放行的关键开关)
          grep -q 'BUILD_BROKEN_ELF_PREBUILT_PRODUCT_COPY_FILES := true' $DT/OrangeFoxConfig.mk || { echo "!! 缺少 ELF 豁免变量, 触屏驱动将被 check-non-elf 硬错拦截"; exit 1; }
          # run#22 解密定案(2026-09-23 实机): RWA82 树 fstab 的 userdata 行用了旧式高通 ICE 加密标志
          # (fileencryption=ice,wrappedkey), 而手机实际是 FBE v2 + wrappedkey(Kyuofox 可用版 fstab 对比实锤)。
          # 解密库按错误标志选错路径 → /data 挂载 "No such device"。替换为与手机真实加密一致的标志:
          FSTAB_N=0
          for F in $(grep -rl 'fileencryption=ice,wrappedkey' $DT 2>/dev/null); do
            sed -i 's|fileencryption=ice,wrappedkey,keydirectory=/metadata/vold/metadata_encryption|fileencryption=aes-256-xts:aes-256-cts:v2+inlinecrypt_optimized+wrappedkey_v0,keydirectory=/metadata/vold/metadata_encryption,metadata_encryption=aes-256-xts:wrappedkey_v0|' "$F"
            grep -q 'inlinecrypt_optimized+wrappedkey_v0' "$F" && { echo ">>> fstab 已修正: $F"; FSTAB_N=$((FSTAB_N+1)); }
          done
          [ "$FSTAB_N" -ge 1 ] || { echo "!! 未找到/未修正含 ICE 加密标志的 fstab"; grep -rl 'fileencryption' $DT | head -5; exit 1; }
          # run#25 解密引擎移植(历史): RWA82 树不含 prepdecrypt/qseecomd/keymint HAL/keystore2
          # 组件 —— v1 解密失败根因之一。曾用 Kyuofox 预编译组件 no-clobber 方案(#25-#29),
          # 实测全数黑屏/循环后废弃; run#32 起改为 houji 参考卷对齐方案(见下方houji_port段):
          # 完整高通 vendor 库 92 个 + THP 触屏管线 + SELinux 宽容 + 分阶段服务启动。
          # 历史教训链: #26 删 insmod 段连累 backlight/USB 行 → #27 黑屏; #28 回填无效(init
          # 未活到 rc 执行); #29 剥 avb_keys 亦无效; #30 对分锁定解密段; #31 锁定 fstab 整换。
          # run#32 对齐版(2026-09-25): 以能用的 houji 参考卷(小米14, 同 fox_14.1/A14/SM8650)
          # 为标准答案重建解密+触屏集成。对分判决: #30 纯净版能开机; 解密段(Kyuofox rc+残缺栈)
          # 黑屏元凶(#27-29); Kyuofox fstab 整文件替换延迟重启循环元凶(#31)。
          # houji 参考卷裁决的四大修正:
          #   1. SELinux early-init 即宽容(enforce 0) —— 外挂服务不触碰策略红线
          #   2. 解密栈 = 完整高通 vendor 库 92 个全量移植(补齐 #29 缺的 11 条依赖:
          #      libQSEEComAPI/libqcbor/libminkdescriptor/libion/libmemunreachable/libqmi 全家桶)
          #   3. 触屏 = THP 用户态管线: ramdisk 内核匹配模块(手机 vendor_dlkm 原版)insmod →
          #      twrp.modules.loaded=true → start touch_report(THP 管线, 缺它驱动收不到触摸数据)
          #      → start qseecomd; 模块加载前不启动(houji 注释: 早启动会 ghost touch)
          #   4. 触屏固件 = 正确 odm 版(210,711B, 手机 /odm/firmware 原件)放 vendor/odm/firmware/;
          #      RWA82 旧版(210,696B)严禁进 ramdisk —— #31 实测会重刷 IC 致触摸上报瘫痪
          export HP="$GITHUB_WORKSPACE/prebuilts/houji_port"
          [ -d "$HP" ] || { echo "!! prebuilts/houji_port 不存在"; exit 1; }
          # rc: houji 版 + aurora 适配(背光/USB 块/insmod/触发属性已内置)
          cp -f "$HP/init.recovery.qcom.rc" "$DT/recovery/root/init.recovery.qcom.rc"
          cp -f "$HP/init.recovery.usb.rc" "$DT/recovery/root/init.recovery.usb.rc"
          # fstab: Kyuofox 剥 avb_keys 版(#31 实证对开机无害, 结构与 houji 一致)
          cp -f "$GITHUB_WORKSPACE/prebuilts/decrypt/recovery.fstab" "$DT/recovery/root/system/etc/recovery.fstab"
          # rc 关键行逐项断言
          grep -q 'panel0-backlight/brightness' "$DT/recovery/root/init.recovery.qcom.rc" || { echo "!! rc 缺背光行"; exit 1; }
          grep -q 'enforce 0' "$DT/recovery/root/init.recovery.qcom.rc" || { echo "!! rc 缺 SELinux 宽容"; exit 1; }
          grep -q 'LD_LIBRARY_PATH' "$DT/recovery/root/init.recovery.qcom.rc" || { echo "!! rc 缺库搜索路径"; exit 1; }
          grep -q 'insmod /vendor/lib/modules/synaptics_tcm2.ko' "$DT/recovery/root/init.recovery.qcom.rc" || { echo "!! rc 缺触屏模块加载"; exit 1; }
          grep -q 'setprop twrp.modules.loaded true' "$DT/recovery/root/init.recovery.qcom.rc" || { echo "!! rc 缺模块加载触发"; exit 1; }
          grep -q 'start touch_report' "$DT/recovery/root/init.recovery.qcom.rc" || { echo "!! rc 缺 THP 管线启动"; exit 1; }
          grep -q 'start vendor.keymint-qti' "$DT/recovery/root/init.recovery.qcom.rc" || { echo "!! rc 缺 keymint 触发"; exit 1; }
          grep -q 'start vendor.qseecomd' "$DT/recovery/root/init.recovery.qcom.rc" || { echo "!! rc 缺 qseecomd 启动"; exit 1; }
          # 服务定义 + 二进制 + 完整高通库 + odm 层
          mkdir -p "$DT/recovery/root/vendor/etc/init" "$DT/recovery/root/vendor/bin/hw" \
                   "$DT/recovery/root/vendor/lib64" "$DT/recovery/root/vendor/odm/etc" \
                   "$DT/recovery/root/vendor/odm/firmware" "$DT/recovery/root/vendor/lib/modules"
          cp -f "$HP/vendor/etc/init/"*.rc "$DT/recovery/root/vendor/etc/init/"
          cp -rf "$HP/vendor/bin/." "$DT/recovery/root/vendor/bin/"
          cp -f "$HP/vendor/lib64/"*.so "$DT/recovery/root/vendor/lib64/"
          cp -f "$HP/vendor/lib/modules/"*.ko "$DT/recovery/root/vendor/lib/modules/"
          cp -f "$HP/vendor/odm/etc/ueventd.rc" "$DT/recovery/root/vendor/odm/etc/ueventd.rc"
          cp -f "$HP/vendor/odm/firmware/"* "$DT/recovery/root/vendor/odm/firmware/"
          chmod 0755 "$DT/recovery/root/vendor/bin/qseecomd" "$DT/recovery/root/vendor/bin/ssgtzd" \
                      "$DT/recovery/root/vendor/bin/se_omapi" "$DT/recovery/root/vendor/bin/touch_report" \
                      "$DT/recovery/root/vendor/bin/hw/"* 2>/dev/null || true
          # prepdecrypt.sh 用 Kyuofox aurora 专属版(houji 版为本机型不适用的他机脚本)
          cp -f "$GITHUB_WORKSPACE/prebuilts/decrypt/vendor/bin/prepdecrypt.sh" "$DT/recovery/root/vendor/bin/prepdecrypt.sh"
          chmod 0755 "$DT/recovery/root/vendor/bin/prepdecrypt.sh"
          # 断言: #29 曾缺失的 11 条依赖对应的库必须全部落位 + 管线二进制 + 正确固件
          for MUST in vendor/lib64/libQSEEComAPI.so vendor/lib64/libqcbor.so vendor/lib64/libminkdescriptor.so \
                      vendor/lib64/libion.so vendor/lib64/libmemunreachable.so vendor/lib64/libdrmfs.so \
                      vendor/lib64/libqmi.so vendor/lib64/libqtikeymint.so vendor/lib64/libjc_keymint_nxp.so \
                      vendor/lib64/libtensorflowlite_touch_c.so vendor/lib64/libtouchsensor.so \
                      vendor/bin/touch_report vendor/bin/qseecomd vendor/odm/firmware/synaptics_spi_aurora.img; do
            [ -f "$DT/recovery/root/$MUST" ] || { echo "!! houji_port 缺件: $MUST"; exit 1; }
          done
          # 断言: RWA82 旧触屏固件严禁进 ramdisk 的 vendor/firmware(正确版只允许在 odm/firmware)
          BADFW=$(find "$DT/recovery/root/vendor/firmware" -name 'synaptics_spi_aurora.img' 2>/dev/null | wc -l)
          [ "$BADFW" = "0" ] || { echo "!! RWA82 触屏固件混入 vendor/firmware(会重刷坏 IC)"; exit 1; }
          # 断言: 内核匹配触屏模块在 ramdisk
          [ -f "$DT/recovery/root/vendor/lib/modules/synaptics_tcm2.ko" ] || { echo "!! 缺内核匹配触屏模块"; exit 1; }
          echo ">>> houji_port 集成完成: $(find $DT/recovery/root/vendor/lib64 -name '*.so' | wc -l) 库 / $(find $DT/recovery/root/vendor/bin -type f | wc -l) 可执行件 / odm 固件+模型就位"
          # ===== run#33: TWRP 满分卷安全件全量对齐 (2026-09-25 #32 活体调试战果固化) =====
          # 1) TA 固件40件(firmware_mnt/image UUID.mbn 含 keymaster TA) — TWRP 的 firmware_mnt
          #    是 ramdisk 自带而非挂载; 没有 TA → keymint 无法加载 keymaster TA → keystore2
          #    无法注册 IKeystoreService → 解密死。
          # 2) libdmabufheap.so + libc++-v35.so — houji 放 system/lib64 我们只搬 vendor 侧,
          #    缺它们 qseecomd exit 255 / keymint SIGABRT。双位落位(system+vendor)。
          # 3) vendor/lib64/hw(libqtigatekeeper/libEseUtils) + vendor/etc/vintf 清单 +
          #    gpfspath_oem_config.xml + ssg/ta_config.json + charger_fw_fstab.qti。
          TF="$GITHUB_WORKSPACE/prebuilts/tw_fill"
          [ -d "$TF" ] || { echo "!! prebuilts/tw_fill 不存在"; exit 1; }
          (cd "$TF" && find . -type f | while read -r F; do
             T="$DT/recovery/root/${F#./}"
             mkdir -p "$(dirname "$T")"
             cp -f "$F" "$T"
           done)
          TAC=$(find "$DT/recovery/root/vendor/firmware_mnt/image" -type f 2>/dev/null | wc -l)
          [ "$TAC" -ge 40 ] || { echo "!! TA 固件不足($TAC<40)"; exit 1; }
          for MUSTF in system/lib64/libdmabufheap.so system/lib64/libc++-v35.so \
                       vendor/lib64/libdmabufheap.so vendor/lib64/libc++-v35.so \
                       vendor/lib64/hw/libqtigatekeeper.so vendor/etc/gpfspath_oem_config.xml \
                       vendor/etc/ssg/ta_config.json vendor/etc/vintf/manifest.xml; do
            [ -f "$DT/recovery/root/$MUSTF" ] || { echo "!! tw_fill 缺件: $MUSTF"; exit 1; }
          done
          # 4) recovery 服务加 stdio_to_kmsg — stdout 进内核日志, 挂死点在 dmesg 可见
          #    (#32 活体调试教训: init 丢弃 stdout, 挂死点成盲区)
          RCPATCH=0
          for F in $(grep -rl "service recovery /system/bin/recovery" \
                     $GITHUB_WORKSPACE/bootable_recovery $GITHUB_WORKSPACE/device \
                     $GITHUB_WORKSPACE/vendor 2>/dev/null); do
            if ! grep -q stdio_to_kmsg "$F"; then
              sed -i "s|service recovery /system/bin/recovery|service recovery /system/bin/recovery\n    stdio_to_kmsg|" "$F"
              RCPATCH=$((RCPATCH+1))
            fi
          done
          [ "$RCPATCH" -ge 1 ] || { echo "!! 未找到 recovery 服务 rc 可补 stdio_to_kmsg"; exit 1; }
          echo ">>> tw_fill 安全件就位: TA=$TAC / stdio_to_kmsg 补丁 $RCPATCH 处"
          # fail-fast (#20 定案): 值内嵌双引号经 orangefox.mk 的 -DVAR='"$(VAR)"' 再包一层,
          # 展开成 ""xxx → C++11 user-defined-literal 硬错(orscmd.o <command line>:28:25)。
          # 源头拦截: 配置里出现带引号的值直接失败, 不烧 60 分钟到 s8 才炸。
          if grep -qE '^[[:space:]]*OF_[A-Z0-9_]+[[:space:]]*[:+?]?=[[:space:]]*"' $DT/OrangeFoxConfig.mk; then
            echo "!! OrangeFoxConfig.mk 存在内嵌双引号的值(orangefox.mk 会再包一层引号 → orscmd 等模块编译硬错), 请去掉引号后重跑"
            exit 1
          fi
          grep -q OrangeFoxConfig.mk $DT/BoardConfig.mk || \
            echo -e '\n-include $(DEVICE_PATH)/OrangeFoxConfig.mk' >> $DT/BoardConfig.mk
          grep -q OrangeFoxConfig.mk $DT/device.mk || \
            echo -e '\n-include $(DEVICE_PATH)/OrangeFoxConfig.mk' >> $DT/device.mk
          # 修复: 树内原本只有 twrp_* 产品, 无 fox_aurora。
          # 在独立目录定义 fox_aurora 产品(继承 twrp_aurora 改名), 避免改动树的 AndroidProducts.mk
          mkdir -p device/xiaomi/aurorafox
          cat > device/xiaomi/aurorafox/AndroidProducts.mk <<'EOF'
          PRODUCT_MAKEFILES := \
              $(LOCAL_DIR)/fox_aurora.mk

          COMMON_LUNCH_CHOICES := \
              fox_aurora-eng
          EOF
          cat > device/xiaomi/aurorafox/fox_aurora.mk <<'EOF'
          $(call inherit-product, device/xiaomi/sm8650/twrp_aurora.mk)
          PRODUCT_NAME := fox_aurora
          PRODUCT_DEVICE := sm8650
          EOF
          echo "=== fox_aurora 产品定义 ==="
          cat device/xiaomi/aurorafox/fox_aurora.mk
          echo "=== twrp_aurora 产品定义(核对 DEVICE_PATH) ==="
          head -25 $DT/twrp_aurora.mk | grep -E "DEVICE_PATH|PRODUCT_NAME"

      - name: 编译 boot image
        run: |
          # run#12 教训: 仅注册 EXIT 的 trap 在 runner 硬杀(信号/管道)场景不触发, 日志推送没有发生且 if:failure 步骤全被跳过。
          # 加固: 诊断函数同时挂 EXIT/INT/TERM/HUP + 防重入; 推送重试 3 次; 额外写 GITHUB_STEP_SUMMARY(check-run summary 可匿名经 API 读取, 不依赖 git push)。
          exec 3>&1 4>&2
          diag_done=0
          on_fail() {
            [ "$diag_done" = 1 ] && return 0
            diag_done=1
            rc=$1
            pkill -f soong_ui 2>/dev/null || true; pkill -f ckati 2>/dev/null || true
            exec 1>&3 2>&4
            echo "=== step8 退出码=$rc, 日志尾部 150 行 ==="
            tail -n 150 /tmp/step8.log 2>/dev/null || true
            echo "=== OOM/被杀进程检查 (dmesg, 需 sudo 否则 dmesg_restrict 下输出为空) ==="
            sudo dmesg -T 2>/dev/null | grep -iE "out of memory|oom|killed process" | tail -n 20 || true
            [ "$rc" -eq 0 ] && return 0
            cd "$GITHUB_WORKSPACE" || return 0
            mkdir -p diag
            cp /tmp/step8.log diag/step8_full.log 2>/dev/null || true
            tail -n 500 /tmp/step8.log > diag/step8_tail500.log 2>/dev/null || true
            { df -h; free -h; swapon --show; echo '== mem pressure =='; cat /proc/pressure/memory 2>/dev/null || true;
              echo '== dmesg oom/kill =='; sudo dmesg -T 2>/dev/null | grep -iE "out of memory|oom|killed process" | tail -n 30;
              echo '== journalctl oom =='; sudo journalctl -k --no-pager 2>/dev/null | grep -iE "out of memory|oom-kill|killed process" | tail -n 10; } > diag/env.txt 2>&1
            grep -inE -A 4 "error:|ninja: build stopped|FAILED:" /tmp/step8.log 2>/dev/null | tail -n 120 > diag/errors.txt || true
            { echo "## step8 exit=$rc 日志尾部 200 行"; echo '```'; tail -n 200 /tmp/step8.log 2>/dev/null; echo '```';
              echo "## error 行"; echo '```'; cat diag/errors.txt; echo '```';
              echo "## OOM/kill 记录"; echo '```'; grep -iE "out of memory|oom|killed process" diag/env.txt || echo "(无)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            git config user.name "foxbuilder"; git config user.email "foxbuilder@users.noreply.github.com"
            git checkout -q --orphan ci-logs 2>/dev/null || git checkout -q ci-logs
            git rm -rqf . 2>/dev/null || true
            git add diag
            git commit -qm "step8 log (run ${GITHUB_RUN_ID} shard ${{ matrix.shard }})"
            for i in 1 2 3; do
              if git push -qf origin ci-logs; then echo ">>> 诊断日志已推送 ci-logs 分支"; break; fi
              echo ">>> 推送失败, 重试 $i"; sleep 5
            done
          }
          trap 'kill $WATCHDOG_PID 2>/dev/null || true; on_fail $?' EXIT
          trap 'on_fail 130' INT
          trap 'on_fail 143' TERM
          trap 'on_fail 129' HUP
          # === run#16 对策: 起步资源断言 + 后台看门狗 + 削内存碎片 ===
          sudo apt-get clean || true
          rm -rf ~/OrangeFox_sync || true
          echo "=== s8 起步资源快照 ==="; df -h /; free -h
          du -sh ~/fox_14.1/.repo ~/fox_14.1/out 2>/dev/null || true
          avail_gb=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          if [ "${avail_gb:-0}" -lt 25 ]; then
            echo "!! 起步可用磁盘仅 ${avail_gb}G(<25G), 必然重蹈 #16 b/c 的 ENOSPC 硬死(agent 自爆连 trap 都不跑); 主动失败, 经 trap 留取证后退出"
            exit 1
          fi
          git worktree add -q --detach /tmp/live-wt 2>/dev/null || true
          git -C /tmp/live-wt checkout -q -B ci-live 2>/dev/null || true
          (
            cd /tmp/live-wt || exit 0
            git config user.name "foxbuilder"; git config user.email "foxbuilder@users.noreply.github.com"
            i=0
            while :; do
              i=$((i+1))
              { echo "== t=${i} $(date -u '+%m-%d %H:%M:%S') =="
                df -h / | tail -1
                free -m | sed -n '1,3p'
                tr '\r' '\n' < /tmp/step8.log 2>/dev/null | tail -1
              } >> live_status.txt
              git add live_status.txt
              git commit -qm "live t=${i}" || true
              git push -qf origin HEAD:refs/heads/ci-live 2>/dev/null || true
              sleep 180
            done
          ) >/dev/null 2>&1 &
          WATCHDOG_PID=$!
          export MALLOC_ARENA_MAX=2
          exec > /tmp/step8.log 2>&1
          cd ~/fox_14.1
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=sm8650   # 与树内 PRODUCT_DEVICE 一致(out 目录为 out/target/product/sm8650)
          export LC_ALL=C
          source build/envsetup.sh
          echo "=== 树内可用 lunch 目标 ==="
          grep -rE "COMMON_LUNCH_CHOICES" -A 12 --include=AndroidProducts.mk device/ vendor/ 2>/dev/null || true
          lunch_ok=0
          # fox_14.1 树内 release 配置只有 ap2a (上轮诊断: "No release config found for TARGET_RELEASE: ap4a. Available releases are: ap2a")
          # lunch 三段格式为 <product>-<release>-<variant>
          for tgt in fox_aurora-ap2a-eng twrp_aurora-ap2a-eng; do
            echo ">>> 尝试 lunch $tgt"
            if lunch "$tgt"; then lunch_ok=1; break; fi
            echo ">>> lunch $tgt 失败, 尝试下一个"
          done
          if [ "$lunch_ok" != 1 ]; then
            echo "!! 所有 lunch 目标均失败, 请对照上方可用目标列表"
            exit 1
          fi
          echo ">>> lunch 成功, 开始 mka (run#19 取证: bootimage 目标在本树无产出, ninja 3036 任务全为 adbd 及其依赖, 12:30 '成功' 但无 .img; 改用 TWRP 标准目标 recoveryimage)"
          built_ok=0
          for tgt in recoveryimage bootimage; do
            echo ">>> mka -j3 $tgt"
            if mka -j3 $tgt; then
              imgs=$(find "$HOME/fox_14.1/out/target/product" -maxdepth 2 -name '*.img' 2>/dev/null)
              if [ -n "$imgs" ]; then
                echo ">>> 目标 $tgt 产出: $imgs"
                built_ok=1
                break
              fi
              echo ">>> mka $tgt 退出 0 但无 .img, 换下一个目标"
            else
              echo ">>> mka $tgt 编译失败, 换下一个目标"
            fi
          done
          if [ "$built_ok" != 1 ]; then
            echo "!! recoveryimage / bootimage 均未产出 .img, 日志尾部 120 行:"
            tail -n 120 /tmp/step8.log
            exit 1
          fi
          # run#18 教训: mka -j3 adbd bootimage 退出 0 且仅 13 分钟, 但 out/target/product 下无任何
          # .img(s13 实锤 "No files were found: output/*.img")→ 目标未产出真实镜像就静默通过。
          # 产物存在性断言: 无 .img 一律按失败处理, exit 1 触发 trap 推送 step8 全量日志取证。
          exec 1>&3 2>&4
          imgs=$(find "$HOME/fox_14.1/out/target/product" -maxdepth 2 -name '*.img' 2>/dev/null)
          echo "=== mka 退出 0, 产物存在性检查 ==="
          echo "$imgs"
          { echo "## mka 成功尾部 30 行"; echo '```'; tail -n 30 /tmp/step8.log 2>/dev/null; echo '```'; \
            echo "## .img 清单"; echo '```'; echo "${imgs:-(空!)}"; echo '```'; } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          if [ -z "$imgs" ]; then
            echo "!! mka 退出 0 但无 .img 产物 (疑似目标未产出真实镜像), product 目录树:"
            ls -laR "$HOME/fox_14.1/out/target/product" 2>/dev/null | tail -n 150
            exit 1
          fi

      - name: 收集错误诊断
        if: failure()
        run: |
          sleep 2   # 等 tee 把尾部刷盘
          mkdir -p "$GITHUB_WORKSPACE/diag"
          # run#27 补强: step7 也留痕(/tmp/step7.log), 否则 step7 失败时 diag 只有 env/errors 空壳,
          # 匿名侧完全无法定位(#25/#26 六路失败只能靠猜的教训)
          [ -f /tmp/step7.log ] && cp /tmp/step7.log "$GITHUB_WORKSPACE/diag/step7_full.log" || true
          [ -f /tmp/step7.log ] && tail -n 400 /tmp/step7.log > "$GITHUB_WORKSPACE/diag/step7_tail400.log" || true
          [ -f /tmp/step8.log ] && tail -n 400 /tmp/step8.log > "$GITHUB_WORKSPACE/diag/step8_tail400.log"
          # (#20 教训) step8 内 trap 已把全量日志放进 diag/step8_full.log, 但下方 git rm 会把它清掉 ——
          # 必须显式保留, 否则 FAILED 块的完整 clang 命令行(含出错的 -D)永远丢失
          [ -f /tmp/step8.log ] && cp /tmp/step8.log "$GITHUB_WORKSPACE/diag/step8_full.log" || true
          [ -f /tmp/fox_build.log ] && tail -n 400 /tmp/fox_build.log > "$GITHUB_WORKSPACE/diag/mka_tail400.log"
          { echo "== df =="; df -h; echo "== free =="; free -h; } > "$GITHUB_WORKSPACE/diag/env.txt" 2>&1
          # 关键报错行单独摘出 (-A 4: 连带 FAILED 下面的完整编译命令行, #20 靠它才能定位 -D 宏)
          grep -inE -A 4 "error:|ninja: build stopped|FAILED:" /tmp/step8.log 2>/dev/null | tail -n 120 \
            > "$GITHUB_WORKSPACE/diag/errors.txt" || true
          ls -la "$GITHUB_WORKSPACE/diag"
          # 同步写入 Step Summary(check-run summary 可匿名经 API 读取)
          { echo "## step7 尾部 120 行"; echo '```'; tail -n 120 /tmp/step7.log 2>/dev/null; echo '```'; \
            echo "## step8 尾部 120 行"; echo '```'; tail -n 120 /tmp/step8.log 2>/dev/null; echo '```'; \
            echo "## error 行"; echo '```'; cat "$GITHUB_WORKSPACE/diag/errors.txt"; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"

      - name: 推送诊断日志到 ci-logs 分支 (匿名可读)
        if: failure()
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "foxbuilder"
          git config user.email "foxbuilder@users.noreply.github.com"
          git checkout -q --orphan ci-logs
          git rm -rqf . 2>/dev/null || true
          git add diag
          git commit -qm "ci: diag logs for run ${GITHUB_RUN_ID} shard ${{ matrix.shard }} (build ${GITHUB_SHA:0:7})"
          git push -qf origin ci-logs
          echo "诊断日志已推送到 ci-logs 分支"

      - name: 上传错误诊断
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-error-diag-${{ matrix.shard }}
          path: diag/*
          if-no-files-found: ignore

      - name: 收集产物
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output"
          echo "=== product 目录 .img 全量搜索 (maxdepth 4) ==="
          find ~/fox_14.1/out/target/product -maxdepth 4 -name "*.img" -type f \
            -exec cp -v {} "$GITHUB_WORKSPACE/output/" \;
          ls -la "$GITHUB_WORKSPACE/output"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-aurora-${{ matrix.shard }}
          path: output/*.img
          if-no-files-found: error
